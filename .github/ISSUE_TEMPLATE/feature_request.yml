name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, rights or provenance considerations
      description: Does this touch contributor data, locations, rights or how recordings are labelled?
